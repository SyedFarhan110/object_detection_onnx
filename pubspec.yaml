    sdk: flutter
  camera: ^0.10.5+5
  ffi: ^2.1.0
  path_provider: ^2.1.1
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/